name: Validate package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate generated files and package
        run: |
          python scripts/build_sources.py --check
          python scripts/build_spec.py --check
          python scripts/build_tokens.py --check
          python scripts/validate_package.py
          python -m unittest discover -s tests -v
          python skills/humanist-frontend/scripts/check_contrast.py
          python scripts/build_release.py --output ../release-check
